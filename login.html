<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMICO JEANS — 거래처 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
/* 서체·색 토큰은 index.html 과 같은 값을 쓴다. 바꿀 일이 있으면 두 파일을 함께 고친다. */
--disp:'Archivo',sans-serif;
--body:'Pretendard',-apple-system,sans-serif;
--ink:#14161A;--indigo:#1E2F4D;--raw:#E8E4DC;--paper:#F7F5F1;--selvedge:#B7332B;
--line:rgba(20,22,26,.14);--mute:#6E7278;--gut:24px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--selvedge);outline-offset:3px}

/* 셀비지 세로선 — 사이트 시그니처. 로그인 화면은 스크롤이 짧아 위치를 고정한다. */
.selvedge{position:fixed;left:10px;top:0;bottom:0;width:1px;background:var(--line);z-index:60}
.selvedge::before{content:"";position:absolute;left:-1px;width:3px;top:14vh;height:22vh;background:var(--selvedge)}
@media(max-width:820px){.selvedge{display:none}}

header{position:sticky;top:0;z-index:50;background:rgba(247,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;padding:0 var(--gut);height:60px;max-width:1320px;margin:0 auto}
.logo{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.22em;white-space:nowrap}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:9px;letter-spacing:.18em;color:var(--mute);margin-top:-3px}

main{max-width:520px;margin:0 auto;padding:56px var(--gut) 90px}
.eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:.01em;line-height:1.2;margin:8px 0 0}
h2{font-size:17px;font-weight:600}

.card{border:1px solid var(--line);background:#fff;padding:28px var(--gut);margin-top:28px;border-top:3px solid var(--selvedge)}
label{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.12em;color:var(--mute);margin-bottom:7px}
input{width:100%;border:1px solid var(--line);padding:12px;font:inherit;font-size:15px;background:var(--paper);border-radius:2px}
input:focus{background:#fff}
.send{width:100%;margin-top:12px;background:var(--ink);color:var(--paper);padding:13px;font-family:var(--disp);font-size:12px;letter-spacing:.14em}
.send:hover{background:var(--indigo)}
.hint{font-size:12.5px;color:var(--mute);line-height:1.55;margin-top:12px}

/* 안내 문구 — 성공/실패가 아니라 「지금 어떤 상태인지」를 적는다. */
#msg{display:none;margin-top:14px;padding:12px 14px;font-size:13.5px;line-height:1.55;border-left:3px solid var(--selvedge);background:rgba(183,51,43,.05)}
#msg.on{display:block}

.signup{margin-top:32px;border-top:1px solid var(--line);padding-top:26px}
.signup p{font-size:14px;color:var(--mute);margin-top:8px}
.need{list-style:none;margin:16px 0 0;border-top:1px solid var(--line)}
.need li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.need li b{font-family:var(--disp);font-size:10.5px;letter-spacing:.1em;color:var(--selvedge);min-width:18px}
.ask{display:inline-block;margin-top:18px;border:1px solid var(--ink);padding:11px 18px;font-family:var(--disp);font-size:11.5px;letter-spacing:.14em}
.ask:hover{background:var(--ink);color:var(--paper)}
.back{margin-top:36px;font-size:13px;color:var(--mute)}
.back a{border-bottom:1px solid var(--line)}
.back a:hover{color:var(--ink);border-bottom-color:var(--ink)}
</style>

<div class="selvedge"></div>

<header><div class="bar">
<a class="logo" href="./index.html">AMICO<small>JEANS · 데님 프로모션</small></a>
</div></header>

<main>
<p class="eyebrow">Client Room</p>
<h1>거래처 로그인</h1>

<section class="card">
<form id="f" novalidate>
<label for="email">이메일</label>
<input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com">
<button class="send" type="submit">로그인 링크 받기</button>
</form>
<p class="hint">입력하신 메일로 로그인 링크를 보내 드립니다. 비밀번호는 만들지 않습니다.</p>
<p id="msg" role="status" aria-live="polite"></p>
</section>

<section class="signup">
<h2>계정이 없으신가요</h2>
<p>거래처 계정은 자유 가입이 아니라 아미코가 직접 발급합니다. 아래 항목을 문의로 보내 주시면 확인 후 계정을 열어 드립니다.</p>
<ul class="need">
<li><b>01</b>회사명</li>
<li><b>02</b>담당자 성함</li>
<li><b>03</b>이메일</li>
<li><b>04</b>연락처</li>
<li><b>05</b>거래 품목</li>
</ul>
<a class="ask" href="./index.html#contact">문의로 계정 신청하기</a>
</section>

<p class="back"><a href="./index.html">시안으로 돌아가기</a></p>
</main>

<script src="./i18n.js"></script>
<script>
/* 인증 백엔드가 아직 없다. 로그인 성공을 흉내내지 않는다 —
   메일 형식만 확인하고, 지금 어떤 상태인지 그대로 적는다. */
var form = document.getElementById('f');
var email = document.getElementById('email');
var msg = document.getElementById('msg');

function say(text) {
  msg.textContent = text;
  msg.classList.add('on');
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  var v = email.value.trim();
  if (!v) {
    say('이메일을 입력해 주세요.');
    email.focus();
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
    say('메일 주소 형식을 다시 확인해 주세요.');
    email.focus();
    return;
  }
  say('로그인 기능은 아직 준비 중입니다. 아래 문의로 연락 주시면 계정을 발급해 드립니다.');
});
</script>
</html>
